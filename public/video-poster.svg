<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE4E8"/>
      <stop offset="55%" stop-color="#FBD0D6"/>
      <stop offset="100%" stop-color="#F4B6BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <rect width="360" height="640" fill="url(#bg)"/>
  <rect width="360" height="640" fill="url(#glow)"/>

  <!-- Decorative blurred circles -->
  <circle cx="60" cy="120" r="80" fill="#FFFFFF" fill-opacity="0.18"/>
  <circle cx="320" cy="540" r="110" fill="#C8102E" fill-opacity="0.08"/>

  <!-- Centered play disc -->
  <g transform="translate(180,300)" filter="url(#soft)">
    <circle r="58" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle r="58" fill="none" stroke="#C8102E" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M -14 -22 L 26 0 L -14 22 Z" fill="#C8102E" fill-opacity="0.85"/>
  </g>

  <!-- Brand wordmark -->
  <g transform="translate(180,408)" text-anchor="middle"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <text fill="#C8102E" fill-opacity="0.85" font-weight="800" font-size="22" letter-spacing="2">CANACT</text>
    <text y="22" fill="#7A1422" fill-opacity="0.55" font-weight="600" font-size="11" letter-spacing="3">LOADING VIDEO</text>
  </g>
</svg>
