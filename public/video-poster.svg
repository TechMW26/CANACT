<?xml version="1.0" encoding="UTF-8"?>
<!-- Minimalist video placeholder: flat near-black canvas + a single
     thin brand-coloured ring with a subtle rotating arc. No text, no
     gradients, no avatars. Matches WhatsApp / iOS "loading video"
     style so the placeholder never competes with the real video that
     paints over it the moment metadata loads. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice">
  <rect width="360" height="640" fill="#0E0E10"/>
  <g transform="translate(180,320)">
    <circle r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
    <circle r="22" fill="none" stroke="#C8102E" stroke-width="2" stroke-linecap="round"
            stroke-dasharray="34 104" transform="rotate(-90)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
